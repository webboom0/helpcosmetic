<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 316" role="img">
  <title>ICCR 참여 구조</title>
  <desc>운영위원회(SC)가 최종 결정을 하고, 산업계 그룹과 옵서버가 의견을 내거나 참관하며, 작업반이 과제를 수행합니다.</desc>
  <defs>
    <marker id="iccrMk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="#999"/>
    </marker>
    <style type="text/css"><![CDATA[
      .t { font: 700 13.5px Pretendard, "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #101010; }
      .s { font: 400 11.5px Pretendard, "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #666; }
      .ln { stroke: #999; stroke-width: 1.5; fill: none; }
      .ln-dash { stroke-dasharray: 4 3; }
      .sc { fill: #f5f4fd; stroke: #4e44df; stroke-width: 1.5; }
      .gy { fill: #f7f8fb; stroke: #ebebeb; stroke-width: 1.5; }
    ]]></style>
  </defs>
  <line class="ln" x1="150" y1="128" x2="232" y2="84" marker-start="url(#iccrMk)" marker-end="url(#iccrMk)"/>
  <text class="s" x="190" y="100" text-anchor="end">협의</text>
  <line class="ln ln-dash" x1="530" y1="128" x2="448" y2="84"/>
  <text class="s" x="496" y="100">참관</text>
  <line class="ln" x1="340" y1="84" x2="340" y2="232" marker-end="url(#iccrMk)"/>
  <text class="s" x="352" y="160">설치·승인</text>
  <line class="ln" x1="120" y1="190" x2="214" y2="262" marker-end="url(#iccrMk)"/>
  <text class="s" x="155" y="232" text-anchor="end">대표 지명</text>
  <line class="ln" x1="560" y1="190" x2="466" y2="262" marker-end="url(#iccrMk)"/>
  <text class="s" x="525" y="232">참여</text>
  <g>
    <rect class="sc" x="220" y="24" width="240" height="56" rx="8"/>
    <text class="t" x="340" y="42" text-anchor="middle" dominant-baseline="central">운영위원회 (SC)</text>
    <text class="s" x="340" y="60" text-anchor="middle" dominant-baseline="central">정회원 규제기관, 최종 결정</text>
  </g>
  <g>
    <rect class="gy" x="40" y="130" width="190" height="56" rx="8"/>
    <text class="t" x="135" y="148" text-anchor="middle" dominant-baseline="central">산업계 그룹 (IG)</text>
    <text class="s" x="135" y="166" text-anchor="middle" dominant-baseline="central">산업협회, 의견 전달</text>
  </g>
  <g>
    <rect class="gy" x="450" y="130" width="190" height="56" rx="8"/>
    <text class="t" x="545" y="148" text-anchor="middle" dominant-baseline="central">옵서버</text>
    <text class="s" x="545" y="166" text-anchor="middle" dominant-baseline="central">참관, 결정 참여 없음</text>
  </g>
  <g>
    <rect class="gy" x="220" y="236" width="240" height="56" rx="8"/>
    <text class="t" x="340" y="254" text-anchor="middle" dominant-baseline="central">작업반 (WG, JWG)</text>
    <text class="s" x="340" y="272" text-anchor="middle" dominant-baseline="central">과제 수행, 산출물 작성</text>
  </g>
</svg>